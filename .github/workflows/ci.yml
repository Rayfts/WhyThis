name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve initial module metadata
        run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: module-metadata
          path: |
            go.mod
            go.sum
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - run: go vet ./...
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -race ./...
      - name: Bench smoke
        run: go test -run '^$' -bench . -benchtime=1x ./internal/gitx ./internal/history ./internal/risk ./internal/storage
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - run: go build ./cmd/whythis
